<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background with gradient -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- Monitor body -->
  <rect x="14" y="16" width="36" height="24" rx="4" fill="url(#monitorGrad)"/>
  <!-- Screen inner -->
  <rect x="17" y="19" width="30" height="18" rx="2.5" fill="#1a1033"/>
  <!-- Monitor stand -->
  <rect x="26" y="42" width="12" height="3" rx="1.5" fill="url(#monitorGrad)"/>
  <rect x="22" y="45" width="20" height="3" rx="1.5" fill="url(#monitorGrad)"/>
  <!-- Play triangle inside screen -->
  <path d="M28 24 L34 28 L28 32 Z" fill="url(#monitorGrad)"/>
  <!-- Recording indicator dot -->
  <circle cx="46" cy="14" r="5" fill="#ef4444"/>
  <circle cx="46" cy="14" r="3" fill="#f87171"/>
</svg>
